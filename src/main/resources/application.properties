# ===== Server =====
server.port=${PORT:8081}

# ===== H2 file-based database (data persists between runs) =====
# The DB file lives at ./data/expensesdb.mv.db relative to the working dir
spring.datasource.url=jdbc:h2:file:./data/expensesdb;
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===== JPA / Hibernate =====
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ===== H2 web console (handy for demos: http://localhost:8081/h2-console) =====
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== Logging =====
logging.level.org.springframework=INFO
logging.level.com.example.expensetracker=DEBUG

# ===== Jackson =====
spring.jackson.serialization.write-dates-as-timestamps=false
